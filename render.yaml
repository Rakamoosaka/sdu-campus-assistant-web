# Render Blueprint: the free web service runs the root Dockerfile; data lives in a free Neon Postgres database.
services:
  - type: web
    name: sdu-campus-assistant
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
